{% set name = "anaconda-assistant-sdk" %}
{% set version = "0.5.2" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_')}}-{{ version }}.tar.gz
  sha256: e9375aa828faf46ae4025a6312f85f5744ca621592da53ca9dcb98a47413ea64

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<39]

requirements:
  host:
    - python
    - hatchling
    - hatch-vcs >=0.3
    - setuptools-scm >=7.1
    - pip
  run:
    - python
    - anaconda-auth >=0.8
    - anaconda-cli-base >=0.5
    - pydantic
  run_constrained:
    - langchain-core >=0.3
    - llm >=0.22
    - pandasai >=2.4
    - panel >=1.6

test:
  source_files:
    - tests
  imports:
    - anaconda_assistant
  commands:
    - pip check
    - pytest -v tests
  requires:
    - pip
    - pytest
    - pytest-mock
    - responses
    # Needed for fix pip check with error missing dependency anaconda-anon-usage:
    - conda

about:
  summary: The Anaconda Assistant Python client
  description: |
    The main Python SDK that provides clients for the API to send messages and receive replies.
  home: https://anaconda.com
  doc_url: https://anaconda.github.io/assistant-sdk/sdk
  dev_url: https://github.com/anaconda/assistant-sdk/tree/main/libs/anaconda-assistant-sdk
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE

extra:
  recipe-maintainers:
    - AlbertDeFusco
